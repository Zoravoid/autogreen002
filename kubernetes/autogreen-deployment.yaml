apiVersion: apps/v1
kind: Deployment
metadata:
  name: autogreen-deployment
  labels:
    app: autogreen
spec:
  replicas: 3
  selector:
    matchLabels:
      app: autogreen
  template:
    metadata:
      labels:
        app: autogreen
    spec:
      containers:
      - name: nginx
        image: nginx:1.14.2
        ports:
        - containerPort: 80

#apply deployment
#kubectl apply -fautogreen-deployment.yaml
#check if pods are created
#kubectl get pods -A