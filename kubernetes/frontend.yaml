apiVersion: apps/v1
kind: Deployment
metadata:
  name: autogreen-frontend-deployment
  labels:
    app: autogreenfrontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autogreenfrontend
  template:
    metadata:
      labels:
        app: autogreenfrontend
    spec:
      containers:
      - name: autogreen-frontend
        image: zoravoid/autogreen:01
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: autogreenfront-service
spec:
  type: NodePort
  selector:
    app: autogreenfrontend
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
    NodePort: 30000