apiVersion: apps/v1
kind: Deployment
metadata:
  name: autogreen-frontend-deployment
  labels:
    app: autogreenfront
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autogreenfront
  template:
    metadata:
      labels:
        app: autogreenfront
    spec:
      containers:
      - name: autogreen-frontend
        image: zoravoid/autogreen:01
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: autogreenfront-service
spec:
  type: NodePort
  selector:
    app: autogreenfront
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
    NodePort: 30000