version: "3.9"

volumes:
  kafka_data:
  zookeeper_data:
  timescale_data:

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: autogreen_zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
  
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://lilithvoid.local:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_MS: 200000
      KAFKA_DELETE_RETENTION_MS: 2000
      KAFKA_SEGMENT_MS: 2000

  db_timescale:
    container_name: autogreen_timescaledb
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: autogreen1234
      POSTGRES_DB: timescaledb
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data

  backend:
    container_name: autogreen_backend_test
    image: zoravoid/autogreen-backend:06
    ports:
      - "8080:8080"
    depends_on:
      - db_timescale
      - kafka

  mediator:
    container_name: godot_mediator
    image: zoravoid/calculia-mediator:03
    ports:
      - "5000:5000"
    depends_on:
      - kafka

  #frontend:
    #container_name: calculia_frontend
    #image: zoravoid/autogreen-frontend:02
    #ports:
      #- 3000:3000
    #depends_on:
      #- backend

  proxy:
    container_name: nginx-proxy
    image: nginx:latest
    ports:
      - "0.0.0.0:80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

