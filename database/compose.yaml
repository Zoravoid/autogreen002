services:
  db_timescale:
    container_name: autogreen_timescaledb
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: autogreen1234
      POSTGRES_DB: timescaledb
    ports:
      - "5433:5432"
  frontend:
    container_name: autogreen_frontend_test
    image: zoravoid/autogreen-frontend:01
    ports:
      - "3000:3000"
    depends_on:
      - backend
  backend:
    container_name: autogreen_backend_test
    image: zoravoid/autogreen-backend:01
    ports:
      - "8080:8080"
    depends_on:
      - timescaledb
      - broker
  broker:
    image: apache/kafka:latest
    container_name: autogreen_kafka_broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3



volumes:
  frontend: {}
  backend: {}
  db_MySQL: {}
  timescaledb: {}


