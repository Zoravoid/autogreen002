services:
  db_timescale:
    container_name: autogreen_timescaledb
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: autogreen1234
      POSTGRES_DB: timescaledb
    ports:
      - "5433:5432"
    # docker exec -it timescaledb psql -d "postgres://postgres:autogreen1234@localhost/postgres" 
    # to connect to postgres use above command
  frontend:
    container_name: autogreen_frontend_test
    image: zoravoid/autogreen-frontend:01
    ports:
      - "3000:3000"
    #depends_on:
    #  - backend
  backend:
    container_name: autogreen_backend_test
    image: zoravoid/autogreen-backend:01
    ports:
      - "8080:8080"
    depends_on:
      - db_MySQL
  db_MySQL:
    container_name: test_mysql
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: autogreen1234
    ports:
      - "5434:3306"

volumes:
  userdb: {}
  sensordb: {}
  timescaledb: {}


#docker exec -it autogreen-userdb psql -U postgres
#docker run -d --name timescaledb -p 5433:5432 -e POSTGRES_PASSWORD=password timescale/timescaledb-ha:pg17