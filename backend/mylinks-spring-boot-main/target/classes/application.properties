## Spring DataSource
spring.datasource.url=jdbc:postgresql://db_timescale:5432/timescaledb?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&serverTimezone=Europe/Bucharest&characterEncoding=utf8&createDatabaseIfNotExist=true
spring.datasource.username=postgres
spring.datasource.password=autogreen1234

server.address=0.0.0.0


spring.jpa.generate-ddl=false
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
#spring.jpa.properties.hibernate.dialect.storage_engine=innodb

logging.level.org.hibernate.SQL=DEBUG
logging.level.com.iucosoft.mylinksspringboot=DEBUG
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.hateoas.use-hal-as-default-json-media-type=false

## Required to define LocaleResolver bean overriding
spring.main.allow-bean-definition-overriding = true

jwt.secret.key=secret_key
## 8 hours
jwt.session.time=28800000

server.error.include-message=always

# Kafka Configuration
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.admin.auto-create-topics=true
spring.kafka.admin.properties.replication.factor=1
spring.kafka.admin.properties.num.partitions=3


# Flyway Configuration
spring.flyway.enabled=false
#spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=test_mysql
#spring.flyway.baseline-version=0
#spring.flyway.validate-on-migrate=true
