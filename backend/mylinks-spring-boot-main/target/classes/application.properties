spring.flyway.url=jdbc:mysql://localhost:5434/test_mysql?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&serverTimezone=Europe/Bucharest&characterEncoding=utf8&createDatabaseIfNotExist=true
