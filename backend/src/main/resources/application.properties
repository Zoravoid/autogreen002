## Spring DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/mylinks_db?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&serverTimezone=Europe/Bucharest&characterEncoding=utf8&createDatabaseIfNotExist=true
spring.datasource.username=iucosoft_user
spring.datasource.password=Iucosoft_user1!

spring.jpa.generate-ddl=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
#spring.jpa.properties.hibernate.dialect.storage_engine=innodb

logging.level.org.hibernate.SQL=DEBUG
logging.level.com.iucosoft.mylinksspringboot=DEBUG
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL57Dialect

spring.hateoas.use-hal-as-default-json-media-type=false

## Required to define LocaleResolver bean overriding
spring.main.allow-bean-definition-overriding = true

jwt.secret.key=secret_key
## 8 hours
jwt.session.time=28800000

server.error.include-message=always

# Flyway Configuration
spring.flyway.enabled=true
#spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=mylinks_db
#spring.flyway.baseline-version=0
#spring.flyway.validate-on-migrate=true
#spring.flyway.sql-migration-prefix=V
#spring.flyway.sql-migration-separator=__
#spring.flyway.sql-migration-suffixes=.sql
spring.flyway.url=jdbc:mysql://localhost:3306/mylinks_db?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&serverTimezone=Europe/Bucharest&characterEncoding=utf8&createDatabaseIfNotExist=true
spring.flyway.user=iucosoft_user
spring.flyway.password=Iucosoft_user1!
spring.flyway.repair-on-migrate=true