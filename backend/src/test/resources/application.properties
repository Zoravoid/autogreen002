spring.main.allow-bean-definition-overriding=true

## Spring DataSource
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=free
spring.datasource.password=free

default.user.password=default

spring.jpa.generate-ddl=true
spring.sql.init.mode=always
spring.jpa.properties.hibernate.dialect.storage_engine=innodb

logging.level.org.hibernate.SQL=DEBUG
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL57Dialect
hibernate.archive.autodetection=class

jwt.secret.key=secret_key
## 8 hours
jwt.session.time=20000

server.error.include-message=always

